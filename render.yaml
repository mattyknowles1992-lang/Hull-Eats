services:
  - type: keyvalue
    name: hull-eats-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: hull-eats-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hull-eats/db exec prisma generate && pnpm --filter @hull-eats/api... build
    startCommand: corepack pnpm --filter @hull-eats/api start
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: DEFAULT_CURRENCY
        value: GBP
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: hull-eats-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: hull-eats-redis
          property: port
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false
      - key: EXPO_PUBLIC_API_URL
        sync: false

  - type: worker
    name: hull-eats-worker
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hull-eats/db exec prisma generate && pnpm --filter @hull-eats/worker... build
    startCommand: corepack pnpm --filter @hull-eats/worker start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: 5
      - key: DEFAULT_CURRENCY
        value: GBP
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: hull-eats-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: hull-eats-redis
          property: port
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false
      - key: EXPO_PUBLIC_API_URL
        sync: false

  - type: web
    name: hull-eats-customer-web
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hull-eats/customer-web build
    startCommand: corepack pnpm --filter @hull-eats/customer-web exec next start --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: DEFAULT_CURRENCY
        value: GBP

  - type: web
    name: hull-eats-merchant-portal
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hull-eats/merchant-portal build
    startCommand: corepack pnpm --filter @hull-eats/merchant-portal exec next start --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: hull-eats-admin-portal
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hull-eats/admin-portal build
    startCommand: corepack pnpm --filter @hull-eats/admin-portal exec next start --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
